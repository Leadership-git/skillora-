<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Résultat — SKILLORA</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,sans-serif;
    background:#050505;
    color:white;
    min-height:100vh;
}

header{
    background:#000;
    border-bottom:1px solid #d4af37;
    padding:20px;
    text-align:center;
}

.logo{
    font-size:30px;
    font-weight:bold;
    letter-spacing:2px;
}

.logo span{
    color:#d4af37;
}

.container{
    width:94%;
    max-width:850px;
    margin:30px auto;
}

.card{
    background:#101010;
    border:1px solid #292929;
    border-radius:18px;
    padding:25px;
    margin-bottom:20px;
    box-shadow:0 0 25px rgba(212,175,55,.08);
}

.center{
    text-align:center;
}

h1{
    color:#d4af37;
    margin-bottom:10px;
}

h2{
    color:#d4af37;
    margin-bottom:15px;
}

.loading{
    text-align:center;
    padding:40px 10px;
    color:#d4af37;
}

.infos{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
    gap:12px;
    margin-top:20px;
}

.info{
    background:#181818;
    border:1px solid #292929;
    border-radius:10px;
    padding:14px;
}

.info strong{
    color:#d4af37;
}

.result-box{
    text-align:center;
    padding:30px 15px;
    background:#181818;
    border:1px solid #333;
    border-radius:15px;
    margin-top:20px;
}

.note{
    font-size:58px;
    font-weight:bold;
    color:#d4af37;
}

.sur{
    font-size:22px;
    color:#aaa;
}

.score{
    margin-top:10px;
    font-size:18px;
}

.groupe{
    display:inline-block;
    margin-top:20px;
    padding:12px 22px;
    border-radius:30px;
    font-size:20px;
    font-weight:bold;
    border:1px solid #d4af37;
    color:#d4af37;
    background:#211d0e;
}

.message{
    margin-top:20px;
    padding:16px;
    border-radius:10px;
    background:#181818;
    border:1px solid #333;
    line-height:1.6;
}

.recommandation{
    margin-top:20px;
    background:#181818;
    border-left:3px solid #d4af37;
    padding:16px;
    line-height:1.6;
}

button{
    width:100%;
    margin-top:20px;
    padding:15px;
    border:none;
    border-radius:10px;
    background:#d4af37;
    color:#000;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    background:#f0cc55;
}

.error{
    color:#ff6666;
}

.hidden{
    display:none;
}

</style>
</head>


<body>

<header>

    <div class="logo">
        SKILL<span>ORA</span>
    </div>

</header>


<div class="container">

    <div class="card center">

        <h1>Résultat de votre évaluation</h1>

        <p>
            Voici votre résultat à l'évaluation SKILLORA.
        </p>

    </div>


    <!-- CHARGEMENT -->

    <div
        id="chargement"
        class="card loading"
    >
        Chargement de votre résultat...
    </div>


    <!-- RESULTAT -->

    <div
        id="resultat"
        class="hidden"
    >

        <!-- INFORMATIONS -->

        <div class="card">

            <h2>Informations du candidat</h2>

            <div class="infos">

                <div class="info">

                    <strong>Nom</strong>

                    <br>

                    <span id="nom">
                        ---
                    </span>

                </div>


                <div class="info">

                    <strong>Prénom</strong>

                    <br>

                    <span id="prenom">
                        ---
                    </span>

                </div>


                <div class="info">

                    <strong>Niveau</strong>

                    <br>

                    <span id="niveau">
                        ---
                    </span>

                </div>


                <div class="info">

                    <strong>Série</strong>

                    <br>

                    <span id="serie">
                        ---
                    </span>

                </div>

            </div>

        </div>


        <!-- NOTE -->

        <div class="card">

            <div class="result-box">

                <h2>Votre note</h2>

                <div class="note">
                    <span id="note">
                        0
                    </span>
                </div>

                <div class="sur">
                    / 20
                </div>

                <div class="score">

                    Score :
                    <strong id="score">
                        0
                    </strong>
                    /
                    <strong id="total">
                        0
                    </strong>

                </div>


                <div
                    id="groupe"
                    class="groupe"
                >
                    ---
                </div>

            </div>

        </div>


        <!-- MESSAGE -->

        <div class="card">

            <h2>Évaluation</h2>

            <div
                id="messageResultat"
                class="message"
            >
            </div>


            <div
                id="recommandation"
                class="recommandation"
            >
            </div>

        </div>


        <div class="card">

            <button
                onclick="window.location.href='index.html'"
            >
                Retour à l'accueil
            </button>

        </div>

    </div>


    <!-- ERREUR -->

    <div
        id="erreur"
        class="card center hidden"
    >

        <h2 class="error">
            Résultat introuvable
        </h2>

        <p style="margin-top:15px;">
            Impossible de récupérer votre résultat.
        </p>

        <button
            onclick="window.location.href='inscription.html'"
        >
            Recommencer
        </button>

    </div>

</div>


<script>

/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL =
    "https://wvwlotoczizpmcllqeyd.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_JB4Y4NC9rEjS9IrazmBG5g_FiXIlY-0";

const db =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =========================================================
   SESSION
========================================================= */

const studentId =
    localStorage.getItem(
        "skillora_student_id"
    );

const attemptId =
    localStorage.getItem(
        "skillora_attempt_id"
    );


const nom =
    localStorage.getItem(
        "skillora_nom"
    ) || "";

const prenom =
    localStorage.getItem(
        "skillora_prenom"
    ) || "";

const niveau =
    localStorage.getItem(
        "skillora_niveau"
    ) || "";

const serie =
    localStorage.getItem(
        "skillora_serie"
    ) || "Aucune";


/* =========================================================
   AFFICHAGE INFOS
========================================================= */

document.getElementById("nom").textContent =
    nom || "---";

document.getElementById("prenom").textContent =
    prenom || "---";

document.getElementById("niveau").textContent =
    niveau || "---";

document.getElementById("serie").textContent =
    serie || "Aucune";


/* =========================================================
   CHARGER RESULTAT
========================================================= */

async function chargerResultat(){

    try{

        if(!studentId || !attemptId){

            afficherErreur();

            return;
        }


        /*
           On recherche le résultat correspondant
           à l attempt actuel.
        */

        const { data, error } =
            await db
            .from("results")
            .select(`
                id,
                attempt_id,
                score,
                total,
                note,
                classe_resultat,
                niveau_estime,
                points_forts,
                points_faibles,
                recommandations,
                created_at
            `)
            .eq(
                "attempt_id",
                attemptId
            )
            .maybeSingle();


        if(error){

            console.error(
                "Erreur résultat :",
                error
            );

            afficherErreur();

            return;
        }


        if(!data){

            /*
               Si le résultat n'est pas encore trouvé,
               on essaie une seconde méthode avec
               l attempt.
            */

            const { data: attemptData } =
                await db
                .from("attempts")
                .select("id,student_id")
                .eq("id",attemptId)
                .eq("student_id",studentId)
                .maybeSingle();


            if(!attemptData){

                afficherErreur();

                return;
            }


            afficherErreur();

            return;
        }


        afficherResultat(data);


    }catch(error){

        console.error(error);

        afficherErreur();

    }

}


/* =========================================================
   AFFICHER RESULTAT
========================================================= */

function afficherResultat(data){

    document.getElementById(
        "chargement"
    ).classList.add("hidden");


    document.getElementById(
        "resultat"
    ).classList.remove("hidden");


    const note =
        Number(data.note || 0);


    const score =
        Number(data.score || 0);


    const total =
        Number(data.total || 0);


    document.getElementById(
        "note"
    ).textContent =
        note.toFixed(2);


    document.getElementById(
        "score"
    ).textContent =
        score;


    document.getElementById(
        "total"
    ).textContent =
        total;


    let groupe =
        data.niveau_estime || "";


    /*
       Sécurité :
       si le groupe n'est pas enregistré,
       on le recalcule.
    */

    if(!groupe){

        if(note >= 16){

            groupe =
                "Groupe Étoile ⭐";

        }else if(note >= 10){

            groupe =
                "Groupe Intermédiaire";

        }else{

            groupe =
                "Non retenu";

        }

    }


    document.getElementById(
        "groupe"
    ).textContent =
        groupe;


    /* =====================================================
       MESSAGE
    ===================================================== */

    const message =
        document.getElementById(
            "messageResultat"
        );


    if(note >= 16){

        message.innerHTML =
            `
            <strong>Excellent résultat ! ⭐</strong>
            <br><br>
            Vous avez obtenu une note de
            <strong>${note.toFixed(2)}/20</strong>.
            <br>
            Vous êtes classé dans le
            <strong>Groupe Étoile</strong>.
            `;


    }else if(note >= 10){

        message.innerHTML =
            `
            <strong>Bon résultat.</strong>
            <br><br>
            Vous avez obtenu une note de
            <strong>${note.toFixed(2)}/20</strong>.
            <br>
            Vous êtes classé dans le
            <strong>Groupe Intermédiaire</strong>.
            `;


    }else{

        message.innerHTML =
            `
            <strong>Résultat insuffisant.</strong>
            <br><br>
            Vous avez obtenu une note de
            <strong>${note.toFixed(2)}/20</strong>.
            <br>
            Vous n'atteignez pas le seuil de
            <strong>10/20</strong>.
            `;
    }


    /* =====================================================
       RECOMMANDATION
    ===================================================== */

    const recommandation =
        document.getElementById(
            "recommandation"
        );


    if(
        data.recommandations &&
        data.recommandations.trim() !== ""
    ){

        recommandation.innerHTML =
            `
            <strong>Recommandation :</strong>
            <br>
            ${echapperHTML(
                data.recommandations
            )}
            `;

    }else{

        if(note >= 16){

            recommandation.innerHTML =
                `
                <strong>Recommandation :</strong>
                <br>
                Continuez à maintenir votre niveau
                et préparez-vous aux prochaines évaluations.
                `;

        }else if(note >= 10){

            recommandation.innerHTML =
                `
                <strong>Recommandation :</strong>
                <br>
                Continuez vos révisions afin de progresser
                et d'atteindre le Groupe Étoile.
                `;

        }else{

            recommandation.innerHTML =
                `
                <strong>Recommandation :</strong>
                <br>
                Renforcez vos bases et reprenez les notions
                qui vous posent des difficultés avant
                une nouvelle préparation.
                `;

        }

    }

}


/* =========================================================
   PROTECTION HTML
========================================================= */

function echapperHTML(texte){

    if(
        texte === null ||
        texte === undefined
    ){

        return "";

    }


    return String(texte)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* =========================================================
   ERREUR
========================================================= */

function afficherErreur(){

    document.getElementById(
        "chargement"
    ).classList.add("hidden");


    document.getElementById(
        "resultat"
    ).classList.add("hidden");


    document.getElementById(
        "erreur"
    ).classList.remove("hidden");

}


/* =========================================================
   LANCEMENT
========================================================= */

chargerResultat();

</script>

</body>
</html>
