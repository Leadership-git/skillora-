<!DOCTYPE html>
<html lang="fr">

<head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Résultat — SKILLORA</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial, sans-serif;
    background:#050505;
    color:#fff;
    min-height:100vh;
}

header{
    background:#080808;
    border-bottom:1px solid #d4af37;
    padding:18px 20px;
    text-align:center;
}

.logo{
    color:#d4af37;
    font-size:28px;
    font-weight:900;
    letter-spacing:2px;
}

.container{
    width:92%;
    max-width:1000px;
    margin:25px auto 50px;
}

.card{
    background:#101010;
    border:1px solid #2b2b2b;
    border-radius:15px;
    padding:20px;
    margin-bottom:20px;
}

.card h2{
    color:#d4af37;
    margin-bottom:15px;
    font-size:20px;
}

.loading{
    text-align:center;
    padding:50px 20px;
    color:#aaa;
}

.error{
    background:#260d0d;
    border:1px solid #8d2c2c;
    color:#ffb0b0;
    padding:18px;
    border-radius:12px;
    text-align:center;
}

.student-info{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:12px;
}

.info-box{
    background:#080808;
    border-radius:10px;
    padding:13px;
}

.info-label{
    color:#888;
    font-size:12px;
    margin-bottom:5px;
}

.info-value{
    font-weight:bold;
}

.global-result{
    text-align:center;
}

.note{
    font-size:65px;
    font-weight:900;
    color:#d4af37;
    line-height:1;
    margin:15px 0;
}

.score{
    color:#ccc;
    font-size:17px;
}

.groupe{
    display:inline-block;
    margin-top:15px;
    padding:10px 20px;
    border-radius:30px;
    background:#171717;
    border:1px solid #d4af37;
    color:#d4af37;
    font-weight:bold;
}

.stats{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:12px;
    margin-top:20px;
}

.stat{
    background:#080808;
    padding:15px;
    border-radius:10px;
    text-align:center;
}

.stat-number{
    display:block;
    font-size:25px;
    font-weight:bold;
    color:#d4af37;
}

.stat-label{
    color:#999;
    font-size:12px;
    margin-top:5px;
}

.subject-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:15px;
}

.subject-card{
    background:#080808;
    border:1px solid #292929;
    border-radius:12px;
    padding:17px;
}

.subject-name{
    color:#d4af37;
    font-size:18px;
    font-weight:bold;
    margin-bottom:13px;
}

.subject-note{
    font-size:30px;
    font-weight:bold;
    margin-bottom:12px;
}

.subject-line{
    display:flex;
    justify-content:space-between;
    padding:7px 0;
    border-bottom:1px solid #1d1d1d;
    font-size:13px;
}

.subject-line:last-child{
    border-bottom:none;
}

.subject-line span:first-child{
    color:#999;
}

.correct{
    color:#58d68d;
}

.incorrect{
    color:#ff7676;
}

.unanswered{
    color:#f4c542;
}

.recommendation{
    background:#080808;
    border-left:4px solid #d4af37;
    padding:17px;
    line-height:1.6;
    color:#ddd;
}

.strengths{
    color:#58d68d;
    line-height:1.6;
}

.weaknesses{
    color:#ff9292;
    line-height:1.6;
}

.date-info{
    color:#aaa;
    font-size:13px;
    margin-top:12px;
}

.button-container{
    text-align:center;
    margin-top:25px;
}

button{
    border:none;
    background:#d4af37;
    color:#000;
    font-weight:bold;
    padding:13px 25px;
    border-radius:10px;
    cursor:pointer;
    font-size:15px;
}

button:hover{
    background:#f0ce58;
}

.hidden{
    display:none;
}

@media(max-width:700px){

    .student-info{
        grid-template-columns:1fr;
    }

    .stats{
        grid-template-columns:1fr 1fr 1fr;
    }

    .subject-grid{
        grid-template-columns:1fr;
    }

    .note{
        font-size:55px;
    }
}

</style>

</head>

<body>

<header>
    <div class="logo">SKILLORA</div>
</header>

<div class="container">

    <div id="chargement" class="card loading">
        Chargement de votre résultat...
    </div>

    <div id="erreur" class="card error hidden"></div>

    <div id="resultat" class="hidden">

        <!-- INFORMATIONS ÉLÈVE -->

        <div class="card">

            <h2>Informations de l'élève</h2>

            <div class="student-info">

                <div class="info-box">
                    <div class="info-label">Nom</div>
                    <div id="nom" class="info-value">—</div>
                </div>

                <div class="info-box">
                    <div class="info-label">Prénom</div>
                    <div id="prenom" class="info-value">—</div>
                </div>

                <div class="info-box">
                    <div class="info-label">Niveau</div>
                    <div id="niveau" class="info-value">—</div>
                </div>

                <div class="info-box">
                    <div class="info-label">Série</div>
                    <div id="serie" class="info-value">—</div>
                </div>

            </div>

        </div>


        <!-- RESULTAT GLOBAL -->

        <div class="card global-result">

            <h2>Résultat global</h2>

            <div id="note" class="note">—</div>

            <div id="score" class="score">
                Score : —
            </div>

            <div id="groupe" class="groupe">
                —
            </div>

            <div class="stats">

                <div class="stat">
                    <span id="nbCorrect" class="stat-number">0</span>
                    <span class="stat-label">Bonnes réponses</span>
                </div>

                <div class="stat">
                    <span id="nbIncorrect" class="stat-number">0</span>
                    <span class="stat-label">Mauvaises réponses</span>
                </div>

                <div class="stat">
                    <span id="nbNonRepondu" class="stat-number">0</span>
                    <span class="stat-label">Non répondues</span>
                </div>

            </div>

            <div id="dateTest" class="date-info"></div>
            <div id="dureeTest" class="date-info"></div>

        </div>


        <!-- MATIERES -->

        <div class="card">

            <h2>Résultats par matière</h2>

            <div id="matieres" class="subject-grid"></div>

        </div>


        <!-- POINTS FORTS -->

        <div class="card">

            <h2>Points forts</h2>

            <div id="pointsForts" class="strengths">
                —
            </div>

        </div>


        <!-- POINTS FAIBLES -->

        <div class="card">

            <h2>Points à améliorer</h2>

            <div id="pointsFaibles" class="weaknesses">
                —
            </div>

        </div>


        <!-- RECOMMANDATIONS -->

        <div class="card">

            <h2>Recommandations</h2>

            <div id="recommandations" class="recommendation">
                —
            </div>

        </div>


        <div class="button-container">
            <button onclick="window.print()">
                Imprimer le résultat
            </button>
        </div>

    </div>

</div>


<script>

/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL =
    "https://wvwlotoczizpmcllqeyd.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_JB4Y4NC9rEjS9IrazmBG5g_FiXIlY-0";

const db = supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* =========================================================
   ELEMENTS
========================================================= */

const chargement =
    document.getElementById("chargement");

const erreur =
    document.getElementById("erreur");

const resultat =
    document.getElementById("resultat");


/* =========================================================
   OUTILS
========================================================= */

function afficherErreur(message){

    chargement.classList.add("hidden");

    resultat.classList.add("hidden");

    erreur.textContent = message;

    erreur.classList.remove("hidden");
}


function afficherResultat(){

    chargement.classList.add("hidden");

    erreur.classList.add("hidden");

    resultat.classList.remove("hidden");
}


function echapper(value){

    if(value === null || value === undefined){
        return "";
    }

    return String(value)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}


function formatDate(date){

    if(!date){
        return "Date inconnue";
    }

    try{

        return new Date(date).toLocaleString(
            "fr-FR",
            {
                day:"2-digit",
                month:"2-digit",
                year:"numeric",
                hour:"2-digit",
                minute:"2-digit"
            }
        );

    }catch(e){

        return date;
    }
}


function calculerDuree(debut, fin){

    if(!debut || !fin){
        return null;
    }

    const d1 = new Date(debut);
    const d2 = new Date(fin);

    const secondes =
        Math.max(
            0,
            Math.floor((d2 - d1) / 1000)
        );

    const minutes =
        Math.floor(secondes / 60);

    const sec =
        secondes % 60;

    return minutes + " min " + sec + " s";
}


function obtenirGroupe(note){

    const n = Number(note);

    if(n >= 16){
        return "Groupe Étoile";
    }

    if(n >= 10){
        return "Groupe Intermédiaire";
    }

    return "Non retenu";
}


/* =========================================================
   RECUPERATION ATTEMPT ID
========================================================= */

function obtenirAttemptId(){

    const params =
        new URLSearchParams(window.location.search);

    const depuisUrl =
        params.get("attempt");

    if(depuisUrl){
        return depuisUrl;
    }

    return localStorage.getItem(
        "skillora_attempt_id"
    );
}


/* =========================================================
   CHARGEMENT DU RESULTAT
========================================================= */

async function chargerResultat(){

    try{

        const attemptId =
            obtenirAttemptId();

        if(!attemptId){

            afficherErreur(
                "Impossible de trouver la tentative du test."
            );

            return;
        }


        /* =================================================
           1. RECUPERER LA TENTATIVE
        ================================================= */

        const {
            data: attempt,
            error: attemptError
        } = await db
            .from("attempts")
            .select("*")
            .eq("id", attemptId)
            .maybeSingle();

        if(attemptError){

            console.error(attemptError);

            throw new Error(
                "Erreur lors de la récupération de la tentative."
            );
        }

        if(!attempt){

            throw new Error(
                "Cette tentative n'existe pas."
            );
        }


        /* =================================================
           2. RECUPERER LE RESULTAT
        ================================================= */

        const {
            data: result,
            error: resultError
        } = await db
            .from("results")
            .select("*")
            .eq("attempt_id", attempt.id)
            .maybeSingle();

        if(resultError){

            console.error(resultError);

            throw new Error(
                "Erreur lors de la récupération du résultat."
            );
        }

        if(!result){

            throw new Error(
                "Le résultat n'est pas encore disponible."
            );
        }


        /* =================================================
           3. RECUPERER L'ELEVE
        ================================================= */

        let student = null;

        if(attempt.student_id){

            const {
                data,
                error
            } = await db
                .from("students")
                .select("*")
                .eq("id", attempt.student_id)
                .maybeSingle();

            if(error){

                console.error(
                    "Erreur étudiant :",
                    error
                );

            }else{

                student = data;
            }
        }


        /* =================================================
           4. RECUPERER LES REPONSES
        ================================================= */

        const {
            data: answers,
            error: answersError
        } = await db
            .from("answers")
            .select("*")
            .eq("attempt_id", attempt.id);

        if(answersError){

            console.error(answersError);

            throw new Error(
                "Impossible de récupérer les réponses."
            );
        }


        /* =================================================
           5. MAP DES REPONSES
        ================================================= */

        const answerMap =
            new Map();

        (answers || []).forEach(answer => {

            const questionId =
                String(answer.question_id);

            /*
             * Si plusieurs lignes existent pour
             * la même question, la dernière est utilisée.
             */
            answerMap.set(
                questionId,
                answer
            );

        });


        /* =================================================
           6. RECUPERER LES QUESTIONS
        ================================================= */

        const questionIds =
            [
                ...new Set(
                    (answers || [])
                        .map(a => a.question_id)
                        .filter(Boolean)
                )
            ];

        let questions = [];


        if(questionIds.length > 0){

            const {
                data,
                error
            } = await db
                .from("questions")
                .select(`
                    id,
                    test_id,
                    question,
                    option_a,
                    option_b,
                    option_c,
                    option_d,
                    points,
                    ordre,
                    bonne_reponse
                `)
                .in("id", questionIds);

            if(error){

                console.error(error);

                throw new Error(
                    "Impossible de récupérer les questions."
                );
            }

            questions = data || [];
        }


        /* =================================================
           7. RECUPERER LES TESTS
        ================================================= */

        const testIds =
            [
                ...new Set(
                    questions
                        .map(q => q.test_id)
                        .filter(Boolean)
                )
            ];

        let tests = [];

        if(testIds.length > 0){

            const {
                data,
                error
            } = await db
                .from("tests")
                .select(`
                    id,
                    titre,
                    classe_id,
                    serie_id,
                    subject_id,
                    niveau,
                    actif
                `)
                .in("id", testIds);

            if(error){

                console.error(error);

                throw new Error(
                    "Impossible de récupérer les tests."
                );
            }

            tests = data || [];
        }


        /* =================================================
           8. RECUPERER LES MATIERES
        ================================================= */

        const subjectIds =
            [
                ...new Set(
                    tests
                        .map(t => t.subject_id)
                        .filter(Boolean)
                )
            ];

        let subjects = [];

        if(subjectIds.length > 0){

            const {
                data,
                error
            } = await db
                .from("subjects")
                .select("id, nom")
                .in("id", subjectIds);

            if(error){

                console.error(error);

                throw new Error(
                    "Impossible de récupérer les matières."
                );
            }

            subjects = data || [];
        }


        /* =================================================
           9. MAPS
        ================================================= */

        const questionMap =
            new Map(
                questions.map(q => [
                    String(q.id),
                    q
                ])
            );

        const testMap =
            new Map(
                tests.map(t => [
                    String(t.id),
                    t
                ])
            );

        const subjectMap =
            new Map(
                subjects.map(s => [
                    String(s.id),
                    s
                ])
            );


        /* =================================================
           10. CALCUL DES STATISTIQUES
        ================================================= */

        const global = {

            points:0,

            totalPoints:0,

            correct:0,

            incorrect:0,

            unanswered:0,

            totalQuestions:0

        };


        const matieres = {};


        questions.forEach(question => {

            const qId =
                String(question.id);

            const answer =
                answerMap.get(qId);

            const test =
                testMap.get(
                    String(question.test_id)
                );

            if(!test){
                return;
            }

            const subject =
                subjectMap.get(
                    String(test.subject_id)
                );

            const subjectId =
                String(test.subject_id);

            const subjectName =
                subject
                    ? subject.nom
                    : "Matière inconnue";


            if(!matieres[subjectId]){

                matieres[subjectId] = {

                    id:subjectId,

                    nom:subjectName,

                    points:0,

                    totalPoints:0,

                    correct:0,

                    incorrect:0,

                    unanswered:0,

                    totalQuestions:0

                };

            }


            const matiere =
                matieres[subjectId];


            const points =
                Number(question.points) || 0;


            matiere.totalQuestions++;

            matiere.totalPoints += points;

            global.totalQuestions++;

            global.totalPoints += points;


            let reponse = null;

            if(answer){

                reponse =
                    answer.reponse;

            }


            const nonRepondu =
                reponse === null ||
                reponse === undefined ||
                String(reponse).trim() === "";


            if(nonRepondu){

                matiere.unanswered++;

                global.unanswered++;

                return;
            }


            /*
             * On utilise la correction présente
             * dans la table questions.
             */

            const correcte =
                String(reponse).trim().toUpperCase() ===
                String(question.bonne_reponse || "")
                    .trim()
                    .toUpperCase();


            if(correcte){

                matiere.correct++;

                global.correct++;

                matiere.points += points;

                global.points += points;

            }else{

                matiere.incorrect++;

                global.incorrect++;
            }

        });


        /* =================================================
           11. NOTE GLOBALE
        ================================================= */

        let noteCalculee = 0;

        if(global.totalPoints > 0){

            noteCalculee =
                (
                    global.points /
                    global.totalPoints
                ) * 20;

        }


        /*
         * Si le résultat enregistré contient déjà
         * une note valide, on la privilégie.
         */

        const noteResult =
            Number(result.note);

        const noteFinale =
            Number.isFinite(noteResult)
                ? noteResult
                : noteCalculee;


        const groupe =
            result.niveau_estime ||
            obtenirGroupe(noteFinale);


        /* =================================================
           12. INFORMATIONS ELEVE
        ================================================= */

        document.getElementById("nom")
            .textContent =
                student?.nom ||
                localStorage.getItem("skillora_nom") ||
                "—";


        document.getElementById("prenom")
            .textContent =
                student?.prenom ||
                localStorage.getItem("skillora_prenom") ||
                "—";


        document.getElementById("niveau")
            .textContent =
                student?.niveau ||
                result.classe_resultat ||
                localStorage.getItem("skillora_niveau") ||
                "—";


        document.getElementById("serie")
            .textContent =
                student?.serie ||
                localStorage.getItem("skillora_serie") ||
                "—";


        /* =================================================
           13. RESULTAT GLOBAL
        ================================================= */

        document.getElementById("note")
            .textContent =
                noteFinale.toFixed(2) + " / 20";


        document.getElementById("score")
            .textContent =
                "Score : " +
                global.points +
                " / " +
                global.totalPoints;


        document.getElementById("groupe")
            .textContent =
                groupe;


        document.getElementById("nbCorrect")
            .textContent =
                global.correct;


        document.getElementById("nbIncorrect")
            .textContent =
                global.incorrect;


        document.getElementById("nbNonRepondu")
            .textContent =
                global.unanswered;


        document.getElementById("dateTest")
            .textContent =
                "Début : " +
                formatDate(attempt.commence_at);


        document.getElementById("dureeTest")
            .textContent =
                attempt.termine_at
                    ? "Durée : " +
                      calculerDuree(
                          attempt.commence_at,
                          attempt.termine_at
                      )
                    : "Durée : —";


        /* =================================================
           14. RESULTATS PAR MATIERE
        ================================================= */

        const matieresContainer =
            document.getElementById("matieres");

        matieresContainer.innerHTML = "";


        const matieresArray =
            Object.values(matieres);


        if(matieresArray.length === 0){

            matieresContainer.innerHTML =
                "<p style='color:#aaa'>Aucun détail par matière disponible.</p>";

        }else{

            matieresArray.forEach(matiere => {

                let noteMatiere = 0;

                if(matiere.totalPoints > 0){

                    noteMatiere =
                        (
                            matiere.points /
                            matiere.totalPoints
                        ) * 20;

                }


                const div =
                    document.createElement("div");

                div.className =
                    "subject-card";


                div.innerHTML = `

                    <div class="subject-name">
                        ${echapper(matiere.nom)}
                    </div>

                    <div class="subject-note">
                        ${noteMatiere.toFixed(2)} / 20
                    </div>

                    <div class="subject-line">
                        <span>Score</span>
                        <strong>
                            ${matiere.points}
                            /
                            ${matiere.totalPoints}
                        </strong>
                    </div>

                    <div class="subject-line">
                        <span>Questions</span>
                        <strong>
                            ${matiere.totalQuestions}
                        </strong>
                    </div>

                    <div class="subject-line">
                        <span>Correctes</span>
                        <strong class="correct">
                            ${matiere.correct}
                        </strong>
                    </div>

                    <div class="subject-line">
                        <span>Incorrectes</span>
                        <strong class="incorrect">
                            ${matiere.incorrect}
                        </strong>
                    </div>

                    <div class="subject-line">
                        <span>Non répondues</span>
                        <strong class="unanswered">
                            ${matiere.unanswered}
                        </strong>
                    </div>

                `;


                matieresContainer.appendChild(div);

            });

        }


        /* =================================================
           15. POINTS FORTS / FAIBLES
        ================================================= */

        let fortes = [];

        let faibles = [];


        matieresArray.forEach(matiere => {

            let note = 0;

            if(matiere.totalPoints > 0){

                note =
                    (
                        matiere.points /
                        matiere.totalPoints
                    ) * 20;

            }


            if(note >= 14){

                fortes.push(
                    matiere.nom +
                    " (" +
                    note.toFixed(2) +
                    "/20)"
                );

            }


            if(note < 10){

                faibles.push(
                    matiere.nom +
                    " (" +
                    note.toFixed(2) +
                    "/20)"
                );

            }

        });


        document.getElementById("pointsForts")
            .textContent =
                result.points_forts ||
                (
                    fortes.length
                        ? fortes.join(" • ")
                        : "Aucun point fort particulier identifié."
                );


        document.getElementById("pointsFaibles")
            .textContent =
                result.points_faibles ||
                (
                    faibles.length
                        ? faibles.join(" • ")
                        : "Aucune faiblesse majeure identifiée."
                );


        /* =================================================
           16. RECOMMANDATIONS
        ================================================= */

        let recommandation =
            result.recommandations;


        if(!recommandation){

            if(noteFinale >= 16){

                recommandation =
                    "Excellent résultat. Continuez à travailler régulièrement afin de maintenir ce niveau.";

            }else if(noteFinale >= 10){

                recommandation =
                    "Résultat satisfaisant. Renforcez les matières les plus faibles afin de progresser.";

            }else{

                recommandation =
                    "Des révisions supplémentaires sont nécessaires. Concentrez-vous en priorité sur les matières les plus faibles.";

            }

        }


        document.getElementById("recommandations")
            .textContent =
                recommandation;


        /* =================================================
           17. SAUVEGARDE LOCALE
        ================================================= */

        localStorage.setItem(
            "skillora_note",
            noteFinale
        );

        localStorage.setItem(
            "skillora_score",
            global.points
        );

        localStorage.setItem(
            "skillora_total",
            global.totalPoints
        );

        localStorage.setItem(
            "skillora_groupe",
            groupe
        );


        /* =================================================
           18. AFFICHAGE
        ================================================= */

        afficherResultat();


    }catch(error){

        console.error(
            "ERREUR RESULTAT :",
            error
        );

        afficherErreur(
            error.message ||
            "Une erreur est survenue lors du chargement du résultat."
        );

    }

}


/* =========================================================

========================================================= */

chargerResultat();
