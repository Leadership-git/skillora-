<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Inscription — SKILLORA</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial,sans-serif;
    background:linear-gradient(135deg,#061522,#0A2435);
    color:#fff;
    min-height:100vh;
}

header{
    padding:20px;
    text-align:center;
    border-bottom:1px solid rgba(255,255,255,.1);
}

.logo{
    font-size:28px;
    font-weight:bold;
    letter-spacing:2px;
    color:#00E5A8;
}

.container{
    width:92%;
    max-width:650px;
    margin:40px auto;
}

.card{
    background:rgba(255,255,255,.08);
    backdrop-filter:blur(15px);
    border:1px solid rgba(255,255,255,.12);
    border-radius:25px;
    padding:30px;
    box-shadow:0 20px 50px rgba(0,0,0,.25);
}

h1{
    text-align:center;
    margin-bottom:10px;
}

.subtitle{
    text-align:center;
    color:#b9cbd3;
    margin-bottom:30px;
}

.pack-box{
    background:linear-gradient(135deg,#00E5A8,#00C8FF);
    color:#061522;
    padding:20px;
    border-radius:18px;
    margin-bottom:25px;
}

.pack-box h2{
    margin-bottom:8px;
}

.price{
    font-size:25px;
    font-weight:bold;
    margin-top:12px;
}

.field{
    margin-bottom:20px;
}

label{
    display:block;
    margin-bottom:8px;
    font-weight:bold;
}

input,select{
    width:100%;
    padding:15px;
    border:none;
    border-radius:12px;
    font-size:16px;
    outline:none;
}

button{
    width:100%;
    padding:17px;
    border:none;
    border-radius:14px;
    background:#00E5A8;
    color:#061522;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    background:#00C8FF;
}

.info{
    text-align:center;
    margin-top:18px;
    color:#b9cbd3;
    font-size:14px;
    line-height:1.6;
}

.back{
    display:block;
    text-align:center;
    margin-top:25px;
    color:#00E5A8;
    text-decoration:none;
}
</style>
</head>

<body>

<header>
    <div class="logo">SKILLORA</div>
</header>

<div class="container">

<div class="card">

<h1>Inscription</h1>

<p class="subtitle">
    Finalise ta commande en quelques secondes.
</p>

<div class="pack-box">

<h2 id="packNom">Pack</h2>

<p id="packContenu"></p>

<div class="price" id="packPrix"></div>

</div>

<form id="commandeForm">

<div class="field">
<label for="nom">Nom et prénom</label>
<input
    type="text"
    id="nom"
    placeholder="Ex : Koné Ibrahim"
    required
>
</div>

<div class="field">
<label for="telephone">Ton numéro WhatsApp</label>
<input
    type="tel"
    id="telephone"
    placeholder="Ex : 0700000000"
    required
>
</div>

<div class="field">
<label for="contact">Choisir le contact WhatsApp</label>

<select id="contact" required>

<option value="">
    -- Choisir un contact --
</option>

<option value="2250718169140">
    WhatsApp 1 — +225 07 18 16 91 40
</option>

<option value="2250769049109">
    WhatsApp 2 — +225 07 69 04 91 09
</option>

</select>

</div>

<button type="submit">
    💬 Commander sur WhatsApp
</button>

<div class="info">
    Après ta commande, nous te communiquerons les instructions
    pour effectuer le paiement.
    <br>
    La formation commence après vérification du paiement.
</div>

</form>

<a href="index.html" class="back">
    ← Retour à SKILLORA
</a>

</div>
</div>

<script>

const packs = {

"Bureautique":{
    nom:"🟢 Pack Bureautique",
    contenu:"Word + Excel + PowerPoint",
    prix:"8 000 F"
},

"Créateur Digital":{
    nom:"🔵 Pack Créateur Digital",
    contenu:"Canva + CapCut + IA + Suno AI",
    prix:"12 000 F"
},

"Marketing & Vente":{
    nom:"🟣 Pack Marketing & Vente",
    contenu:"Marketing digital + Publicité + Vente en ligne + WhatsApp Business",
    prix:"15 000 F"
},

"Business Digital":{
    nom:"🟠 Pack Business Digital",
    contenu:"IA + Marketing + Création de contenu + Vente en ligne",
    prix:"15 000 F"
}

};


// Récupération du pack choisi

const params = new URLSearchParams(window.location.search);

const packChoisi = params.get("pack");

const pack = packs[packChoisi];


// Affichage du pack

if(pack){

    document.getElementById("packNom").textContent = pack.nom;

    document.getElementById("packContenu").textContent =
        pack.contenu;

    document.getElementById("packPrix").textContent =
        pack.prix;

}else{

    document.getElementById("packNom").textContent =
        "Aucun pack sélectionné";

    document.getElementById("packContenu").textContent =
        "Retourne à la boutique pour choisir une formation.";

}


// Commande WhatsApp

document.getElementById("commandeForm").addEventListener(
    "submit",
    function(e){

        e.preventDefault();


        const nom =
            document.getElementById("nom").value.trim();

        const telephone =
            document.getElementById("telephone").value.trim();

        const numero =
            document.getElementById("contact").value;


        if(!numero){

            alert("Veuillez choisir un contact WhatsApp.");

            return;

        }


        if(!pack){

            alert("Veuillez sélectionner un pack.");

            return;

        }


        const message =
`Bonjour SKILLORA 👋

Je souhaite commander une formation.

👤 Nom : ${nom}

📱 Mon WhatsApp : ${telephone}

🎓 Formation : ${pack.nom}

📚 Contenu : ${pack.contenu}

💰 Prix : ${pack.prix}

Je souhaite recevoir les instructions pour effectuer le paiement.

Merci.`;



        const url =
            "https://wa.me/" +
            numero +
            "?text=" +
            encodeURIComponent(message);


        window.location.href = url;

    }
);

</script>

</body>
</html>
