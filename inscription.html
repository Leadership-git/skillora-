<!DOCTYPE html>
<html lang="fr">
<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Inscription — SKILLORA</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

/* =========================================================
   RESET
========================================================= */

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
}


/* =========================================================
   BODY
========================================================= */

body{

    min-height:100vh;

    background:
        radial-gradient(
            circle at top left,
            rgba(212,175,55,.20),
            transparent 35%
        ),

        radial-gradient(
            circle at bottom right,
            rgba(120,80,10,.20),
            transparent 40%
        ),

        #050505;

    color:#fff;

    display:flex;

    justify-content:center;

    align-items:center;

    padding:20px;

}


/* =========================================================
   CONTAINER
========================================================= */

.container{

    width:100%;

    max-width:500px;

    background:
        linear-gradient(
            145deg,
            rgba(22,22,22,.98),
            rgba(8,8,8,.98)
        );

    border:

        1px solid
        rgba(212,175,55,.45);

    border-radius:25px;

    padding:30px 22px;

    box-shadow:

        0 0 35px
        rgba(212,175,55,.10),

        inset 0 0 30px
        rgba(212,175,55,.025);

}


/* =========================================================
   LOGO
========================================================= */

.logo{

    text-align:center;

    font-size:36px;

    font-weight:900;

    letter-spacing:1px;

    margin-bottom:8px;

}

.skill{

    color:#d4af37;

    text-shadow:
        0 0 12px
        rgba(212,175,55,.25);

}

.ora{

    color:#fff;

}


/* =========================================================
   SLOGAN
========================================================= */

.slogan{

    text-align:center;

    color:#aaa;

    font-size:14px;

    margin-bottom:28px;

}


/* =========================================================
   TITRE
========================================================= */

h1{

    text-align:center;

    font-size:24px;

    margin-bottom:25px;

    color:#f1d77a;

}


/* =========================================================
   LABEL
========================================================= */

label{

    display:block;

    margin:15px 0 7px;

    font-weight:bold;

    color:#e9e9e9;

}


/* =========================================================
   INPUT + SELECT
========================================================= */

input,
select{

    width:100%;

    padding:15px;

    border-radius:13px;

    border:

        1px solid
        #3c3521;

    background:#111;

    color:white;

    outline:none;

    font-size:15px;

    transition:.2s;

}

input:focus,
select:focus{

    border-color:#d4af37;

    box-shadow:

        0 0 0 2px
        rgba(212,175,55,.10);

}


select option{

    background:#111;

    color:#fff;

}


/* =========================================================
   SÉRIE
========================================================= */

#serieContainer{

    display:none;

}


/* =========================================================
   BOUTON
========================================================= */

button{

    width:100%;

    margin-top:27px;

    padding:16px;

    border:none;

    border-radius:14px;

    background:

        linear-gradient(
            90deg,
            #b8860b,
            #d4af37,
            #f1d77a,
            #d4af37,
            #b8860b
        );

    background-size:200% 100%;

    color:#080808;

    font-size:16px;

    font-weight:900;

    cursor:pointer;

    box-shadow:

        0 8px 25px
        rgba(212,175,55,.18);

    transition:.25s;

}

button:hover{

    transform:translateY(-1px);

    box-shadow:

        0 10px 30px
        rgba(212,175,55,.28);

}

button:disabled{

    opacity:.55;

    cursor:not-allowed;

    transform:none;

}


/* =========================================================
   MESSAGE
========================================================= */

.message{

    display:none;

    margin-top:18px;

    padding:14px;

    border-radius:12px;

    text-align:center;

    line-height:1.5;

    font-size:14px;

}


/* =========================================================
   ERREUR
========================================================= */

.erreur{

    display:block;

    background:
        rgba(255,50,50,.08);

    border:
        1px solid
        rgba(255,80,80,.35);

    color:#ff9292;

}


/* =========================================================
   SUCCÈS
========================================================= */

.succes{

    display:block;

    background:
        rgba(212,175,55,.08);

    border:
        1px solid
        rgba(212,175,55,.35);

    color:#f1d77a;

}


/* =========================================================
   INFO
========================================================= */

.info{

    text-align:center;

    color:#777;

    font-size:12px;

    line-height:1.6;

    margin-top:20px;

}


/* =========================================================
   PETIT TRAIT DORÉ
========================================================= */

.gold-line{

    width:70px;

    height:3px;

    background:#d4af37;

    margin:

        0 auto
        22px;

    border-radius:10px;

}

</style>

</head>


<body>


<div class="container">


    <!-- =====================================================
         LOGO
    ====================================================== -->

    <div class="logo">

        <span class="skill">
            SKILL
        </span>

        <span class="ora">
            ORA
        </span>

    </div>


    <div class="slogan">

        Plateforme éducative et d'évaluation

    </div>


    <div class="gold-line"></div>


    <h1>
        Accéder au test
    </h1>


    <!-- =====================================================
         FORMULAIRE
    ====================================================== -->

    <form id="inscriptionForm">


        <!-- NOM -->

        <label for="nom">
            Nom
        </label>

        <input
            type="text"
            id="nom"
            placeholder="Votre nom"
            required
        >


        <!-- PRÉNOM -->

        <label for="prenom">
            Prénom
        </label>

        <input
            type="text"
            id="prenom"
            placeholder="Votre prénom"
            required
        >


        <!-- WHATSAPP -->

        <label for="whatsapp">
            Numéro WhatsApp
        </label>

        <input
            type="tel"
            id="whatsapp"
            placeholder="Ex : 0700000000"
            required
        >


        <!-- CLASSE -->

        <label for="classe">
            Classe / Niveau
        </label>

        <select
            id="classe"
            required
        >

            <option value="">
                Chargement des classes...
            </option>

        </select>


        <!-- SÉRIE -->

        <div id="serieContainer">

            <label for="serie">
                Série
            </label>

            <select id="serie">

                <option value="">
                    Sélectionnez votre série
                </option>

            </select>

        </div>


        <!-- CODE -->

        <label for="code">
            Code d'accès
        </label>

        <input
            type="text"
            id="code"
            placeholder="Ex : SKILLORA-UNIVERSEL"
            required
            autocomplete="off"
            autocapitalize="characters"
        >


        <!-- BOUTON -->

        <button
            type="submit"
            id="btn"
        >

            ACCÉDER AU TEST

        </button>


    </form>


    <!-- MESSAGE -->

    <div
        id="message"
        class="message"
    ></div>


    <!-- INFORMATION -->

    <div class="info">

        Le code d'accès ne peut être utilisé qu'une seule fois.

        <br>

        Vérifiez votre classe et votre série avant de continuer.

    </div>


</div>



<script>

/* =========================================================
   CONFIGURATION SUPABASE
========================================================= */

const SUPABASE_URL =
    "https://wvwlotoczizpmcllqeyd.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_JB4Y4NC9rEjS9IrazmBG5g_FiXIlY-0";


const db =
    supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =========================================================
   ÉLÉMENTS
========================================================= */

const form =
    document.getElementById(
        "inscriptionForm"
    );


const nomInput =
    document.getElementById(
        "nom"
    );


const prenomInput =
    document.getElementById(
        "prenom"
    );


const whatsappInput =
    document.getElementById(
        "whatsapp"
    );


const classeSelect =
    document.getElementById(
        "classe"
    );


const serieSelect =
    document.getElementById(
        "serie"
    );


const serieContainer =
    document.getElementById(
        "serieContainer"
    );


const codeInput =
    document.getElementById(
        "code"
    );


const btn =
    document.getElementById(
        "btn"
    );


const message =
    document.getElementById(
        "message"
    );


/* =========================================================
   AFFICHER MESSAGE
========================================================= */

function afficherMessage(
    texte,
    type
){

    message.textContent =
        texte;

    message.className =
        "message " + type;

    message.style.display =
        "block";

}


/* =========================================================
   CHARGER LES CLASSES
========================================================= */

async function chargerClasses(){

    const {
        data,
        error
    } =
        await db
        .from("classes")
        .select(
            "id, nom, ordre"
        )
        .order(
            "ordre",
            {
                ascending:true
            }
        );


    if(error){

        console.error(
            "Erreur classes :",
            error
        );

        classeSelect.innerHTML =
            '<option value="">Erreur de chargement</option>';

        afficherMessage(
            "Impossible de charger les classes : " +
            error.message,
            "erreur"
        );

        return;

    }


    classeSelect.innerHTML =
        '<option value="">Sélectionnez votre classe</option>';


    data.forEach(
        classe => {

            const option =
                document.createElement(
                    "option"
                );


            option.value =
                classe.id;


            option.textContent =
                classe.nom;


            classeSelect.appendChild(
                option
            );

        }
    );

}


/* =========================================================
   CHARGER LES SÉRIES
========================================================= */

async function chargerSeries(){

    const {
        data,
        error
    } =
        await db
        .from("series")
        .select(
            "id, nom"
        )
        .order(
            "id",
            {
                ascending:true
            }
        );


    if(error){

        console.error(
            "Erreur séries :",
            error
        );

        serieSelect.innerHTML =
            '<option value="">Erreur de chargement</option>';

        return;

    }


    serieSelect.innerHTML =
        '<option value="">Sélectionnez votre série</option>';


    data.forEach(
        serie => {

            const option =
                document.createElement(
                    "option"
                );


            option.value =
                serie.id;


            option.textContent =
                serie.nom;


            serieSelect.appendChild(
                option
            );

        }
    );

}


/* =========================================================
   AFFICHER LA SÉRIE
   6 = 2nde
   7 = 1ère
   8 = Terminale
========================================================= */

classeSelect.addEventListener(
    "change",
    function(){

        const classeId =
            Number(
                this.value
            );


        if(

            classeId === 6 ||
            classeId === 7 ||
            classeId === 8

        ){

            serieContainer.style.display =
                "block";


            serieSelect.required =
                true;

        }else{

            serieContainer.style.display =
                "none";


            serieSelect.required =
                false;


            serieSelect.value =
                "";

        }

    }
);


/* =========================================================
   VÉRIFIER LE CODE
========================================================= */

async function verifierCode(
    code
){

    const codePropre =
        code
        .trim()
        .toUpperCase();


    const {
        data,
        error
    } =
        await db
        .from("access_codes")
        .select(`
            id,
            code,
            test_id,
            student_id,
            utilise,
            date_expiration,
            session_id
        `)
        .eq(
            "code",
            codePropre
        )
        .maybeSingle();


    if(error){

        console.error(
            "Erreur vérification code :",
            error
        );

        throw new Error(
            "Erreur lors de la vérification du code : " +
            error.message
        );

    }


    if(!data){

        throw new Error(
            "Code d'accès incorrect."
        );

    }


    if(data.utilise === true){

        throw new Error(
            "Ce code a déjà été utilisé."
        );

    }


    if(data.date_expiration){

        const maintenant =
            new Date();


        const expiration =
            new Date(
                data.date_expiration
            );


        if(
            maintenant > expiration
        ){

            throw new Error(
                "Ce code d'accès a expiré."
            );

        }

    }


    return data;

}


/* =========================================================
   CRÉER L'ÉLÈVE
========================================================= */

async function creerStudent(

    nom,
    prenom,
    whatsapp,
    classeId,
    serieId

){

    /*
       Nous générons nous-mêmes l'ID.

       Cela évite d'utiliser :

       .insert(...).select().single()

       qui peut provoquer un blocage RLS
       lors de la lecture de la ligne créée.
    */

    const studentId =
        crypto.randomUUID();


    const {
        error
    } =
        await db
        .from("students")
        .insert({

            id:
                studentId,

            nom:
                nom,

            prenom:
                prenom,

            classe_id:
                classeId,

            serie_id:
                serieId,

            whatsapp_eleve:
                whatsapp

        });


    if(error){

        console.error(
            "Erreur student :",
            error
        );

        throw new Error(
            "Erreur lors de l'enregistrement de l'élève : " +
            error.message
        );

    }


    return {

        id:
            studentId

    };

}


/* =========================================================
   UTILISER LE CODE
========================================================= */

async function utiliserCode(

    accessCodeId,
    studentId

){

    /*
       IMPORTANT :

       Aucun .select() ici.

       Nous voulons uniquement mettre à jour
       le code.
    */

    const {
        error
    } =
        await db
        .from("access_codes")
        .update({

            student_id:
                studentId,

            utilise:
                true

        })
        .eq(
            "id",
            accessCodeId
        )
        .eq(
            "utilise",
            false
        );


    if(error){

        console.error(
            "Erreur utilisation code :",
            error
        );

        throw new Error(
            "Erreur lors de la validation du code : " +
            error.message
        );

    }


    return true;

}


/* =========================================================
   FORMULAIRE
========================================================= */

form.addEventListener(
    "submit",
    async function(event){

        event.preventDefault();


        message.style.display =
            "none";


        btn.disabled =
            true;


        btn.textContent =
            "VÉRIFICATION...";


        try{


            /* =================================================
               DONNÉES
            ================================================= */

            const nom =
                nomInput.value.trim();


            const prenom =
                prenomInput.value.trim();


            const whatsapp =
                whatsappInput.value.trim();


            const classeId =
                Number(
                    classeSelect.value
                );


            if(!nom){

                throw new Error(
                    "Veuillez entrer votre nom."
                );

            }


            if(!prenom){

                throw new Error(
                    "Veuillez entrer votre prénom."
                );

            }


            if(!whatsapp){

                throw new Error(
                    "Veuillez entrer votre numéro WhatsApp."
                );

            }


            if(!classeId){

                throw new Error(
                    "Veuillez sélectionner votre classe."
                );

            }


            const niveau =
                classeSelect
                .options[
                    classeSelect.selectedIndex
                ]
                .textContent;


            /* =================================================
               SÉRIE
            ================================================= */

            let serieId =
                null;


            let serie =
                "";


            if(

                classeId === 6 ||
                classeId === 7 ||
                classeId === 8

            ){

                if(!serieSelect.value){

                    throw new Error(
                        "Veuillez sélectionner votre série."
                    );

                }


                serieId =
                    Number(
                        serieSelect.value
                    );


                serie =
                    serieSelect
                    .options[
                        serieSelect.selectedIndex
                    ]
                    .textContent;

            }


            /* =================================================
               CODE
            ================================================= */

            const code =
                codeInput.value
                .trim()
                .toUpperCase();


            if(!code){

                throw new Error(
                    "Veuillez entrer votre code d'accès."
                );

            }


            /* =================================================
               VÉRIFICATION CODE
            ================================================= */

            const accessCode =
                await verifierCode(
                    code
                );


            /* =================================================
               CRÉATION ÉLÈVE
            ================================================= */

            btn.textContent =
                "ENREGISTREMENT...";


            const student =
                await creerStudent(

                    nom,
                    prenom,
                    whatsapp,
                    classeId,
                    serieId

                );


            /* =================================================
               UTILISER LE CODE
            ================================================= */

            btn.textContent =
                "VALIDATION...";


            await utiliserCode(

                accessCode.id,
                student.id

            );


            /* =================================================
               LOCAL STORAGE
            ================================================= */

            localStorage.setItem(
                "skillora_student_id",
                student.id
            );


            localStorage.setItem(
                "skillora_code_id",
                accessCode.id
            );


            localStorage.setItem(
                "skillora_nom",
                nom
            );


            localStorage.setItem(
                "skillora_prenom",
                prenom
            );


            localStorage.setItem(
                "skillora_whatsapp",
                whatsapp
            );


            localStorage.setItem(
                "skillora_niveau",
                niveau
            );


            localStorage.setItem(
                "skillora_niveau_id",
                classeId
            );


            localStorage.setItem(
                "skillora_serie",
                serie
            );


            localStorage.setItem(
                "skillora_serie_id",
                serieId === null
                    ? ""
                    : serieId
            );


            /*
               Suppression de l'ancien test_id
               pour éviter qu'un ancien test
               reste dans le navigateur.
            */

            localStorage.removeItem(
                "skillora_test_id"
            );


            localStorage.removeItem(
                "skillora_test_ids"
            );


            /* =================================================
               SUCCÈS
            ================================================= */

            afficherMessage(
                "Accès validé ! Votre test va commencer.",
                "succes"
            );


            btn.textContent =
                "ACCÈS VALIDÉ";


            setTimeout(
                function(){

                    window.location.href =
                        "test.html";

                },
                800
            );


        }catch(error){

            console.error(
                "ERREUR FINALE :",
                error
            );


            afficherMessage(

                error.message ||
                "Une erreur est survenue.",

                "erreur"

            );


            btn.disabled =
                false;


            btn.textContent =
                "ACCÉDER AU TEST";

        }

    }
);


/* =========================================================
   INITIALISATION
========================================================= */

async function initialiser(){

    await chargerClasses();

    await chargerSeries();

}


initialiser();

</script>

</body>
</html>
