<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SKILLORA — Fermé temporairement</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
    font-family:Arial,sans-serif;
    background:
        radial-gradient(circle at top left,#12344a,transparent 40%),
        radial-gradient(circle at bottom right,#17204b,transparent 40%),
        #020812;
    color:white;
}

.card{
    width:100%;
    max-width:600px;
    text-align:center;
    padding:45px 25px;
    border-radius:28px;
    background:rgba(10,30,45,.8);
    border:1px solid rgba(255,255,255,.12);
    box-shadow:0 25px 80px rgba(0,0,0,.5);
}

.logo{
    font-size:38px;
    font-weight:900;
    letter-spacing:3px;
    margin-bottom:30px;
    color:#00E5A8;
}

.logo span{
    color:#00C8FF;
}

.icon{
    font-size:65px;
    margin-bottom:20px;
}

h1{
    font-size:30px;
    margin-bottom:15px;
}

p{
    color:#b9cbd3;
    line-height:1.7;
    font-size:16px;
}

.badge{
    display:inline-block;
    margin-top:25px;
    padding:10px 18px;
    border-radius:30px;
    background:rgba(255,180,0,.12);
    border:1px solid rgba(255,180,0,.35);
    color:#ffd166;
    font-weight:bold;
}

.footer{
    margin-top:35px;
    color:#64748b;
    font-size:13px;
}
</style>
</head>

<body>

<div class="card">

    <div class="logo">
        SKILL<span>ORA</span>
    </div>

    <div class="icon">
        🔒
    </div>

    <h1>
        Site temporairement fermé
    </h1>

    <p>
        Merci à tous ceux qui ont participé à notre
        offre exceptionnelle.
    </p>

    <p style="margin-top:12px;">
        Les inscriptions sont actuellement suspendues.
        <br>
        SKILLORA prépare la prochaine étape.
    </p>

    <div class="badge">
        🚧 Maintenance en cours
    </div>

    <div class="footer">
        © 2026 SKILLORA — Formations digitales
    </div>

</div>

</body>
</html>
